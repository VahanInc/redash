# This configuration file is for the **development** setup.
# For a production example please refer to getredash/setup repository on GitHub.
version: "2.2"
x-redash-service: &redash-service
  build:
    context: .
#    args:
#      skip_frontend_build: ""
#  volumes:
#    - .:/app
  env_file:
    - .env

# Shared resource anchor for long-running queries
x-long-running-resources: &long-running-resources
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '0.5'

x-redash-environment: &redash-environment
  REDASH_LOG_LEVEL: "INFO"
  REDASH_REDIS_URL: "redis://redis:6379/0"
  REDASH_DATABASE_URL: "postgresql://redash:${PG_PASS}@postgres:5432/redash"
  REDASH_RATELIMIT_ENABLED: "false"
  REDASH_ENFORCE_CSRF: "true"
  # Set secret keys in the .env file
services:
  server:
    <<: *redash-service
    command: dev_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
      - "5678:5678"
    environment:
      <<: *redash-environment
      PYTHONUNBUFFERED: 0
    restart: unless-stopped
  scheduler:
    <<: *redash-service
    command: dev_scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
      - redis
      - postgres
    environment:
      <<: *redash-environment
    restart: unless-stopped
  worker_scheduled_queries_1:
    <<: *redash-service
    <<: *long-running-resources
    command: dev_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    environment:
      <<: *redash-environment
      PYTHONUNBUFFERED: 0
      QUEUES: scheduled_queries
    restart: unless-stopped
